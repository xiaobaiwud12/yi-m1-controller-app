# ---------------------------------------------------------------------------
# There is deliberately no `org.gradle.java.home` here any more.
#
# It used to pin one machine's JDK —
#     org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.11
# — because that machine's JAVA_HOME points at a GraalVM JDK 25, and Android's build
# derives a JDK image from `core-for-system-modules.jar` with `jlink`, a transform
# that fails under JDK 25 (`JdkImageTransform ... jlink.exe`) behind a misleading
# "upgrade your AGP version" hint from Flutter. The AGP here is 9.1.0 and is not the
# problem.
#
# The reason it is gone is that the path is **one machine's**, and a tracked
# absolute path is a hard build failure for everybody else: Gradle ignores JAVA_HOME
# when this property is set, so a stranger with a perfectly good JDK 17 or 21 was
# told `Java home supplied is invalid` and nothing else. It was the first thing a
# contributor hit (`analysis/63` §4.2, §12.3 item 18).
#
# Set it where it belongs instead — on the machine, not in the repository, in
# `~/.gradle/gradle.properties` (Windows: `%USERPROFILE%\.gradle\gradle.properties`):
#
#     org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.11
#
# That file is not tracked by anything, applies to every Gradle build for that user,
# and is what this repository's own machine uses. `flutter config --jdk-dir=<path>`
# is the Flutter-native equivalent and works for `flutter build`, but not for a bare
# `gradlew` invocation, which is why the Gradle properties file is the one named in
# the release repository's README.
#
# Everything else in this file is the Flutter template's own content and is safe for
# any machine. See analysis/65 §9 for the runbook.
# ---------------------------------------------------------------------------
